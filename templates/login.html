<div id="view-login" class="tab-content">
  <div class="login-container" style="max-width: 400px; margin: 0 auto; padding: 24px 16px;">
    <div class="login-header" style="text-align: center; margin-bottom: 32px;">
      <span class="material-symbols-outlined" style="font-size: 48px; color: var(--md-sys-color-primary);">android</span>
      <h1 style="font-size: 1.75rem; font-weight: 800; margin: 16px 0 8px;">TesterTribe</h1>
      <p style="color: var(--md-sys-color-on-surface-variant); margin: 0;">登入以刊登測試 App 專案</p>
    </div>

    <div class="login-benefits" style="background: var(--md-sys-color-surface-container); border-radius: 16px; padding: 20px; margin-bottom: 24px; border: 1px solid var(--md-sys-color-outline-variant);">
      <h3 style="font-size: 0.95rem; font-weight: 700; margin: 0 0 12px; display: flex; align-items: center; gap: 8px;">
        <span class="material-symbols-outlined" style="color: var(--md-sys-color-primary);">verified</span>
        登入後可使用的功能
      </h3>
      <ul style="margin: 0; padding-left: 20px; font-size: 0.875rem; color: var(--md-sys-color-on-surface-variant); line-height: 1.8;">
        <li>刊登新測試 App 專案</li>
        <li>管理自己的開發者頁面</li>
        <li>按讚收藏感興趣的專案</li>
        <li>回報已加入測試並追蹤進度</li>
        <li>發表評論、回報 Bug、提出建議</li>
      </ul>
    </div>

    <button id="btn-login-page" class="btn btn-primary" style="width: 100%; padding: 16px; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width: 20px; height: 20px;">
      使用 Google 帳號登入
    </button>

    <p style="text-align: center; margin: 20px 0 0; font-size: 0.8rem; color: var(--md-sys-color-outline);">
      登入即表示同意我們的服務條款與隱私權政策
    </p>

    <div style="text-align: center; margin-top: 24px;">
      <button class="btn btn-tonal" onclick="window.switchTab('market-android')" style="padding: 8px 16px; font-size: 0.875rem;">
        <span class="material-symbols-outlined">arrow_back</span> 返回市集瀏覽
      </button>
    </div>
  </div>

  <script type="module">
    // Check if already logged in and redirect
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
    import { auth } from './js/firebase-config.js';
    import { navigate, getStoreFromUrl } from './js/router.js';

    onAuthStateChanged(auth, (user) => {
      if (user) {
        const store = getStoreFromUrl();
        navigate('dev-profile', { store, authorIdentifier: user.uid });
      }
    });
  </script>
</div>
