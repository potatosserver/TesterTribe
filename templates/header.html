<header>
  <div class="header-content">
    <!-- Hamburger Menu Button (mobile only, left side) -->
    <button id="hamburger-btn" class="hamburger-btn mobile-only" aria-label="打開選單" onclick="toggleMobileDrawer()">
      <span class="material-symbols-outlined">menu</span>
    </button>

    <div class="logo" onclick="goToMarket()">
      <span class="material-symbols-outlined" style="font-size: 28px;">android</span>
      TesterTribe
    </div>

    <div class="header-right" style="display: flex; align-items: center; gap: 12px;">
      <!-- Market Tabs (desktop only) -->
      <div class="store-tabs desktop-only" style="display: flex; gap: 8px;">
        <button id="btn-market-android" class="store-tab active" onclick="window.switchTab('market-android')">
          <span class="material-symbols-outlined" style="font-size: 20px;">android</span> Google Play
        </button>
        <button id="btn-market-ios" class="store-tab" onclick="window.switchTab('market-ios')">
          <span style="font-size: 20px;">🍎</span> App Store
        </button>
      </div>

      <!-- Login button (desktop only) -->
      <button id="btn-login" class="btn btn-primary desktop-only" onclick="window.authSetLoginOrigin?.(); window.switchTab('login')">
        <span class="material-symbols-outlined">login</span> 登入
      </button>

      <!-- Avatar button (ALWAYS visible, right side) -->
      <img id="header-avatar" class="avatar-btn" src="" alt="Profile" style="display: none;" onclick="toggleProfileDropdown(event)" onerror="this.onerror=null; this.src=window.DEFAULT_AVATAR;">

      <div id="profile-dropdown" class="profile-dropdown" onclick="event.stopPropagation()">
        <div class="dropdown-header">
          <img id="menu-user-photo" class="dropdown-avatar" src="" alt="Avatar" onerror="this.onerror=null; this.src=window.DEFAULT_AVATAR;">
          <div id="menu-user-name" style="font-weight: 800;">--</div>
          <div id="menu-user-email" style="font-size: 0.85rem; color: #666;">--</div>
        </div>
        <div class="menu-item" onclick="window.switchTab('publish'); closeProfileDropdown();">
          <span class="material-symbols-outlined" style="color: var(--md-sys-color-primary);">add_circle</span> 刊登新 App
        </div>
        <div class="menu-item" id="menu-my-profile" onclick="openMyProfile(); closeProfileDropdown();" style="display: none;">
          <span class="material-symbols-outlined" style="color: var(--md-sys-color-primary);">person</span> 我的開發者頁面
        </div>
        <div class="menu-item" style="color: var(--md-sys-color-error);" onclick="handleLogout();">
          <span class="material-symbols-outlined">logout</span> 登出帳號
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Mobile Drawer -->
<div id="mobile-drawer" class="mobile-drawer" onclick="closeMobileDrawer(event)">
  <div class="mobile-drawer-content" onclick="event.stopPropagation()">
    <div class="mobile-drawer-header">
      <div class="logo" onclick="goToMarket(); closeMobileDrawer();">
        <span class="material-symbols-outlined" style="font-size: 28px;">android</span>
        TesterTribe
      </div>
      <button class="drawer-close-btn" onclick="closeMobileDrawer()" aria-label="關閉選單">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    
    <nav class="mobile-nav">
      <button class="mobile-nav-item active" onclick="window.switchTab('market-android'); closeMobileDrawer();">
        <span class="material-symbols-outlined">android</span> Google Play 市集
      </button>
      <button class="mobile-nav-item" onclick="window.switchTab('market-ios'); closeMobileDrawer();">
        <span style="font-size: 24px;">🍎</span> App Store 市集
      </button>
      <div class="mobile-nav-divider"></div>
      <button id="mobile-btn-login" class="mobile-nav-item" onclick="window.authSetLoginOrigin?.(); window.switchTab('login'); closeMobileDrawer();">
        <span class="material-symbols-outlined">login</span> 登入
      </button>
    </nav>

    <div id="mobile-user-section" class="mobile-user-section" style="display: none;">
      <div class="mobile-nav-divider"></div>
      <button class="mobile-nav-item" onclick="window.switchTab('publish'); closeMobileDrawer();">
        <span class="material-symbols-outlined">add_circle</span> 刊登新 App
      </button>
      <button id="mobile-menu-my-profile" class="mobile-nav-item" onclick="openMyProfile(); closeMobileDrawer();" style="display: none;">
        <span class="material-symbols-outlined">person</span> 我的開發者頁面
      </button>
      <button class="mobile-nav-item" style="color: var(--md-sys-color-error);" onclick="handleLogout(); closeMobileDrawer();">
        <span class="material-symbols-outlined">logout</span> 登出帳號
      </button>
    </div>
  </div>
</div>

<!-- Drawer backdrop -->
<div id="drawer-backdrop" class="drawer-backdrop" onclick="closeMobileDrawer()"></div>

<script>
  function goToMarket() {
    const store = getStoreFromUrl();
    navigate('market', {store});
  }
</script>
