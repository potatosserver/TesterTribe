<div id="view-market-android" class="tab-content">
  <div class="hero-banner">
    <div>
      <h1 class="hero-title">
        <span class="material-symbols-outlined" style="font-size: 32px;">android</span>
        Google Play 市集
      </h1>
      <p class="hero-subtitle">Android 開發者互助測試社群</p>
    </div>
    <button class="btn btn-tonal" onclick="switchTab('publish')">
      <span class="material-symbols-outlined">add</span> 刊登我的 App
    </button>
  </div>

  <div class="filter-section">
    <div class="search-box">
      <span class="material-symbols-outlined" style="color: var(--md-sys-color-outline);">search</span>
      <input type="text" id="search-input-android" class="search-input" placeholder="搜尋專案名稱、包名或開發者...">
    </div>
    <div class="filter-controls">
      <div>
        <label for="filter-status-android">狀態：</label>
        <select id="filter-status-android" class="form-control">
          <option value="all">全部</option>
          <option value="open">招募中</option>
          <option value="closed">已結束</option>
        </select>
      </div>
      <div>
        <label for="filter-sort-android">排序：</label>
        <select id="filter-sort-android" class="form-control">
          <option value="auto">自動（綜合權重）</option>
          <option value="popular">熱門（愛心數）</option>
          <option value="rating">評價（星星數）</option>
        </select>
      </div>
    </div>
    <!-- Mobile filter button -->
    <button id="btn-filter-android" class="btn btn-outlined filter-toggle-btn" style="display: none; margin-top: 12px; width: 100%;">
      <span class="material-symbols-outlined">tune</span> 篩選與排序
    </button>
  </div>

  <div id="market-app-list-android" class="app-grid"></div>

  <div style="text-align: center; margin-top: 36px;">
    <button id="btn-load-more-android" class="btn btn-tonal" style="padding: 12px 32px;">
      <span class="material-symbols-outlined">expand_more</span> 載入更多專案
    </button>
    <div id="no-more-msg-android" style="display: none; color: #888; margin-top: 12px; font-size: 0.9rem;">已載入全部專案！</div>
  </div>
</div>
